  // --- 1. GLOBAL DATA CLEANUP & DEDUPLICATION ---
  // Create a unique list based on Product name to kill duplicates immediately!
  let uniqueDealsMap = new Map();
  rawData.forEach(item => {
      if (item.Store) {
          const storeStr = String(item.Store);
          const parts = storeStr.split("&").map(s => s.trim());
          let cleanParts = [];
          let hasMarkSave = false;
          
          parts.forEach(p => {
              const pUp = p.toUpperCase();
              if (pUp === "MARK" || pUp === "SAVE" || pUp === "MARK & SAVE") {
                  hasMarkSave = true;
              } else if (p.length > 0) {
                  cleanParts.push(p);
              }
          });
          
          if (hasMarkSave) cleanParts.push("MARK & SAVE");
          item.Store = cleanParts.join(" & ");
      }
      // Only keep the first instance of each product name
      const title = item.Product || "Unknown item";
      if (!uniqueDealsMap.has(title)) {
          uniqueDealsMap.set(title, item);
      }
  });

  function formatDisplayDate(dateStr) {
      if (!dateStr) return "";
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const day = parts[2].padStart(2, '0');
      return `${day}/${months[parseInt(parts[1], 10) - 1]}/${parts[0]}`;
  }

  function formatPriceNumber(num) {
      if (num == null) return "";
      return Number(num).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

          matchSearch = searchTokens.every(token => productName.includes(token));
      }

      const matchStore = selectedStores.length === 0 || selectedStores.some(selected => {
          if (!item.Store) return false;
          const itemStoreParts = String(item.Store).toUpperCase().split("&").map(s => s.trim());
          const selectedUp = selected.toUpperCase();
          
          if (selectedUp === "MARK & SAVE") {
              return itemStoreParts.includes("MARK") || itemStoreParts.includes("SAVE") || itemStoreParts.includes("MARK & SAVE");
          }
          return itemStoreParts.includes(selectedUp);
      });

      const matchPrice = (item.Price === null) || (item.Price <= max);
      return matchSearch && matchStore && matchPrice;
    });

    if (sortVal === 'price-asc') {
        filteredData.sort((a, b) => (a.Price || 0) - (b.Price || 0));
    } else if (sortVal === 'price-desc') {
        filteredData.sort((a, b) => (b.Price || 0) - (a.Price || 0));
    } else if (sortVal === 'store-asc') {
        filteredData.sort((a, b) => (a.Store || "").localeCompare(b.Store || ""));
    } else if (sortVal === 'offer-desc') {
        filteredData.sort((a, b) => {
            const offerDiff = getOfferVal(b.Offer) - getOfferVal(a.Offer);
            if (offerDiff !== 0) return offerDiff;
            const dateA = a.Fetched_Date || "";
            const dateB = b.Fetched_Date || "";
            return dateB.localeCompare(dateA);
        });
    }

    currentIndex = 0;
    if(dealGrid) dealGrid.innerHTML = ''; 
    loadMore();
  };

  // --- 4. HTML GENERATOR ---
  function loadMore() {
    if (!dealGrid || !sentinel) return;

    if (currentIndex >= filteredData.length) {
        sentinel.style.display = 'none';
        return;
    }
    sentinel.style.display = 'block';

    const chunk = filteredData.slice(currentIndex, currentIndex + CHUNK_SIZE);
    const fragment = document.createDocumentFragment();

    const riyalSymbol = `<span style="font-family: Arial, sans-serif;" aria-label="SAR" title="SAR">﷼</span>`;

    chunk.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      const safeName = (item.Product || "Unknown item").replace(/'/g, "&apos;").replace(/"/g, "&quot;");
      
      const imgTag = item.Image_URL 
          ? `<img src="${item.Image_URL}" alt="${safeName}" loading="lazy" onclick="openPopup('${item.Image_URL}', '${safeName}')">` 
          : "No image";

      const priceHtml = item.Price 
          ? `<div class="price-badge">${riyalSymbol} <span class="card-price">${formatPriceNumber(item.Price)}</span></div>` 
          : "";
          
      const oldPriceHtml = item.Old_Price ? `<span class="card-old-price">${riyalSymbol} ${formatPriceNumber(item.Old_Price)}</span>` : "";
      const offerStr = item.Offer ? `<span class="badge-offer">${item.Offer}</span>` : "";

      const displayDate = formatDisplayDate(item.Fetched_Date);
      const fetchDate = item.Fetched_Date ? `Updated: ${displayDate}` : "";

      let storeStr = String(item.Store || "Unknown store");
      let storeArr = storeStr.split("&").map(s => s.trim());
      let displayStore = storeArr.join(" & ");

      card.innerHTML = `
          <div class="card-img-wrapper">${imgTag}</div>
          <div class="card-title">${item.Product || "Unknown item"}</div>
          <div class="card-price-row">
              ${priceHtml}
              ${oldPriceHtml}
              ${offerStr}
          </div>
          <div class="card-store">${displayStore}</div>
          <div class="card-date">${fetchDate}</div>
      `;
      fragment.appendChild(card);
    });
      
    dealGrid.appendChild(fragment);
    currentIndex += chunk.length;
    countLabel.innerHTML = `Showing <strong>${currentIndex}</strong> of <strong>${filteredData.length}</strong> products`;
  }

  setTimeout(() => {
      const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
            loadMore();
        }
      }, { rootMargin: "200px" }); 
      
      if(sentinel) observer.observe(sentinel);
      applyFilters();
  }, 100);

  window.resetFilters = function() {
    const searchInput = document.getElementById('filter-product');
    if(searchInput) searchInput.value = '';
    document.getElementById('sortDropdown').value = 'offer-desc'; 
    document.getElementById('storeSearchInput').value = '';
    document.querySelectorAll('.store-cb').forEach(cb => cb.checked = false);
    slider.value = maxPrice;
    filterStoreList();
    applyFilters();
  };

  window.filterStoreList = function() {
      let input = document.getElementById('storeSearchInput').value.toLowerCase();
      let storeLabels = document.querySelectorAll('.checkbox-label');
      
      storeLabels.forEach(label => {
          let storeName = label.innerText.toLowerCase();
          if (storeName.includes(input)) {
              label.style.display = "flex";
          } else {
              label.style.display = "none";
          }
      });
  };

  window.openPopup = function(src, title) {
    const img = document.getElementById('popup-img');
    img.src = src;
    img.classList.remove('zoomed'); 
    document.getElementById('popup-title').innerHTML = title;
    document.getElementById('popup-overlay').classList.add('active');
  };

  window.toggleZoom = function(e) {
    e.stopPropagation(); 
    const img = document.getElementById('popup-img');
    img.classList.toggle('zoomed');
  };

  window.closePopup = function(e) {
    if (e && e.target && e.target.id === 'popup-img') return;
    if (!e || e.target === document.getElementById('popup-overlay') || e.currentTarget === document.getElementById('popup-close')) {
      document.getElementById('popup-overlay').classList.remove('active');
    }
  };

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.getElementById('popup-overlay').classList.remove('active');
    }
  });
</script>
</html>
