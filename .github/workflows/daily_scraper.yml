name: Daily Deals Scraper

on:
  schedule:
    # 1st Run: 00:00 UTC = 3:00 AM Saudi Time (Runs ONLY on Wednesday)
    - cron: '0 0 * * 3'
    # 2nd Run: 06:00 UTC = 9:00 AM Saudi Time (Daily Runs)
    - cron: '0 6 * * *'
  workflow_dispatch:

# --- Gives the robot permission to save files to your repository ---
permissions:
  contents: write

jobs:
  scrape-deals:
    runs-on: ubuntu-24.04 # <-- FIXED: Resolves the ubuntu-latest deprecation warning
    timeout-minutes: 355  # <-- ADDED: Fails gracefully before the 6-hour hard limit

    steps:
      - name: Check out the code
        uses: actions/checkout@v4 # Note: Node 20 warning here is auto-handled by GitHub

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Libraries
        run: pip install httpx google-genai beautifulsoup4 playwright supabase

      - name: Install Playwright Web Browser
        run: playwright install chromium --with-deps

      # ---> Food scraper runs FIRST! <---
      - name: Run Cobone Food Scraper
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python cobone_scraper.py

      # ---> Grocery scraper runs SECOND! <---
      - name: Run D4D Grocery Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python d4d_scraper.py

      # --- Saves files safely back to your GitHub folder only if they exist ---
      - name: Save Website Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          git commit -m "Auto-updated grocery and food deals" || exit 0
          git push
